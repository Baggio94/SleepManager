name: Build SleepManager 0.3.0 Dev

on:
  push:
    branches: [v0.3.0-dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build APKs
        run: gradle :app:assembleDebug :helper:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SleepManager-0.3.0-dev.apk
          cp helper/build/outputs/apk/debug/helper-debug.apk dist/SleepManager-Helper-0.3.0-dev.apk

      - name: Upload development APKs
        uses: actions/upload-artifact@v4
        with:
          name: SleepManager-0.3.0-dev
          path: dist/*.apk
          if-no-files-found: error
