name: Build signed Thor candidate

on:
  push:
    branches:
      - "dev/0.7.1"
    paths:
      - ".github/workflows/signed-thor-candidate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SLEEPMANAGER_STORE_PASSWORD: ${{ secrets.SLEEPMANAGER_KEYSTORE_PASSWORD }}
      SLEEPMANAGER_KEY_ALIAS: ${{ secrets.SLEEPMANAGER_KEY_ALIAS }}
      SLEEPMANAGER_KEY_PASSWORD: ${{ secrets.SLEEPMANAGER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify candidate source
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_VERSION_NAME=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^SLEEPMANAGER_VERSION_CODE=//p' gradle.properties)
          [ "$VERSION_NAME" = "0.7.1" ]
          [ "$VERSION_CODE" = "551" ]
          echo "Candidate source: $(git rev-parse HEAD)"
          echo "Main: $VERSION_NAME ($VERSION_CODE)"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.SLEEPMANAGER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ]
          [ -n "$SLEEPMANAGER_STORE_PASSWORD" ]
          [ -n "$SLEEPMANAGER_KEY_ALIAS" ]
          [ -n "$SLEEPMANAGER_KEY_PASSWORD" ]
          KEYSTORE_PATH="$RUNNER_TEMP/sleepmanager-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SLEEPMANAGER_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Main candidate
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify signed candidate
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_CODE=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_NAME=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          EXPECTED=$(sed -n 's/^SLEEPMANAGER_SIGNING_SHA256=//p' gradle.properties | tr '[:upper:]' '[:lower:]' | tr -d ':')

          [ "$PACKAGE" = "com.med.sleepmanager" ]
          [ "$VERSION_NAME" = "0.7.1" ]
          [ "$VERSION_CODE" = "551" ]
          [ "$CERT" = "$EXPECTED" ]

          mkdir -p thor-candidate
          cp "$APK" thor-candidate/SleepManager-0.7.1-Thor-test.apk
          sha256sum thor-candidate/SleepManager-0.7.1-Thor-test.apk > thor-candidate/SHA256.txt
          printf 'commit=%s\nversionName=%s\nversionCode=%s\ncertificate=%s\n'             "$(git rev-parse HEAD)" "$VERSION_NAME" "$VERSION_CODE" "$CERT"             > thor-candidate/BUILD_INFO.txt

      - name: Upload signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: SleepManager-0.7.1-Thor-signed
          path: thor-candidate/
          if-no-files-found: error
          retention-days: 7
