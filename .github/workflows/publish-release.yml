name: Publish stable release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest

    env:
      SLEEPMANAGER_STORE_PASSWORD: ${{ secrets.SLEEPMANAGER_KEYSTORE_PASSWORD }}
      SLEEPMANAGER_KEY_ALIAS: ${{ secrets.SLEEPMANAGER_KEY_ALIAS }}
      SLEEPMANAGER_KEY_PASSWORD: ${{ secrets.SLEEPMANAGER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.SLEEPMANAGER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] \
            || [ -z "$SLEEPMANAGER_STORE_PASSWORD" ] \
            || [ -z "$SLEEPMANAGER_KEY_ALIAS" ] \
            || [ -z "$SLEEPMANAGER_KEY_PASSWORD" ]; then
            echo "::error::Stable signing secrets are not fully configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/sleepmanager-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SLEEPMANAGER_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Read and validate version
        run: |
          set -euo pipefail

          VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_VERSION_NAME=//p' gradle.properties)
          [ -n "$VERSION_NAME" ] || {
            echo "::error::Version name is missing."
            exit 1
          }

          case "$VERSION_NAME" in
            *-*)
              echo "::error::Stable release workflow refuses prerelease version: $VERSION_NAME"
              exit 1
              ;;
          esac

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version v$VERSION_NAME."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build signed APKs
        run: gradle :app:assembleRelease :helper:assembleRelease

      - name: Verify package IDs and signatures
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          MAIN_APK="app/build/outputs/apk/release/app-release.apk"
          HELPER_APK="helper/build/outputs/apk/release/helper-release.apk"

          MAIN_PACKAGE=$("$AAPT" dump badging "$MAIN_APK" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -n 1)
          HELPER_PACKAGE=$("$AAPT" dump badging "$HELPER_APK" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -n 1)

          [ "$MAIN_PACKAGE" = "com.med.sleepmanager" ]
          [ "$HELPER_PACKAGE" = "com.med.sleepmanager.helper" ]

          MAIN_CERT=$("$APKSIGNER" verify --print-certs "$MAIN_APK" \
            | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          HELPER_CERT=$("$APKSIGNER" verify --print-certs "$HELPER_APK" \
            | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          EXPECTED_CERT=$(sed -n 's/^SLEEPMANAGER_SIGNING_SHA256=//p' gradle.properties \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':')

          [ "$MAIN_CERT" = "$HELPER_CERT" ]
          [ "$MAIN_CERT" = "$EXPECTED_CERT" ]

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p dist

          cp app/build/outputs/apk/release/app-release.apk \
            "dist/SleepManager-$VERSION_NAME.apk"
          cp helper/build/outputs/apk/release/helper-release.apk \
            "dist/SleepManager-Helper-$VERSION_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SleepManager $VERSION_NAME" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SleepManager $VERSION_NAME" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

          gh release upload "$RELEASE_TAG" \
            "dist/SleepManager-$VERSION_NAME.apk" \
            "dist/SleepManager-Helper-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
