name: Build signed SleepManager APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "dev/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SLEEPMANAGER_STORE_PASSWORD: ${{ secrets.SLEEPMANAGER_KEYSTORE_PASSWORD }}
      SLEEPMANAGER_KEY_ALIAS: ${{ secrets.SLEEPMANAGER_KEY_ALIAS }}
      SLEEPMANAGER_KEY_PASSWORD: ${{ secrets.SLEEPMANAGER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.SLEEPMANAGER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] \
            || [ -z "$SLEEPMANAGER_STORE_PASSWORD" ] \
            || [ -z "$SLEEPMANAGER_KEY_ALIAS" ] \
            || [ -z "$SLEEPMANAGER_KEY_PASSWORD" ]; then
            echo "::error::Stable signing secrets are not fully configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/sleepmanager-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          echo "SLEEPMANAGER_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test, lint and build signed release APKs
        run: |
          gradle \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :helper:lintDebug \
            :app:assembleRelease \
            :helper:assembleRelease

      - name: Verify package IDs and signatures
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          MAIN_APK="app/build/outputs/apk/release/app-release.apk"
          HELPER_APK="helper/build/outputs/apk/release/helper-release.apk"

          MAIN_PACKAGE=$("$AAPT" dump badging "$MAIN_APK" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -n 1)
          HELPER_PACKAGE=$("$AAPT" dump badging "$HELPER_APK" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -n 1)

          [ "$MAIN_PACKAGE" = "com.med.sleepmanager" ] || {
            echo "::error::Unexpected main package ID: $MAIN_PACKAGE"
            exit 1
          }

          [ "$HELPER_PACKAGE" = "com.med.sleepmanager.helper" ] || {
            echo "::error::Unexpected helper package ID: $HELPER_PACKAGE"
            exit 1
          }

          MAIN_CERT=$("$APKSIGNER" verify --print-certs "$MAIN_APK" \
            | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          HELPER_CERT=$("$APKSIGNER" verify --print-certs "$HELPER_APK" \
            | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          [ -n "$MAIN_CERT" ] || {
            echo "::error::Main APK is not signed."
            exit 1
          }

          [ "$MAIN_CERT" = "$HELPER_CERT" ] || {
            echo "::error::Main and Helper APKs use different signing certificates."
            exit 1
          }

          EXPECTED_CERT=$(sed -n 's/^SLEEPMANAGER_SIGNING_SHA256=//p' gradle.properties \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':')

          [ -n "$EXPECTED_CERT" ] || {
            echo "::error::Expected release certificate fingerprint is missing."
            exit 1
          }

          [ "$MAIN_CERT" = "$EXPECTED_CERT" ] || {
            echo "::error::Unexpected release signing certificate: $MAIN_CERT"
            echo "::error::Expected: $EXPECTED_CERT"
            exit 1
          }

          echo "Package IDs verified."
          echo "Pinned release signing certificate verified: $MAIN_CERT"

      - name: Prepare artifacts
        id: package
        run: |
          set -euo pipefail

          VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_VERSION_NAME=//p' gradle.properties)
          HELPER_VERSION_NAME=$(sed -n 's/^SLEEPMANAGER_HELPER_VERSION_NAME=//p' gradle.properties)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p dist

          cp app/build/outputs/apk/release/app-release.apk \
            "dist/SleepManager-$VERSION_NAME.apk"
          cp helper/build/outputs/apk/release/helper-release.apk \
            "dist/SleepManager-Helper-$HELPER_VERSION_NAME.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SleepManager-${{ steps.package.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30


      - name: Build signed 0.6.0 rollback safety APKs
        if: startsWith(github.ref, 'refs/heads/dev/')
        id: rollback
        run: |
          set -euo pipefail

          CURRENT_VERSION_CODE=$(sed -n 's/^SLEEPMANAGER_VERSION_CODE=//p' gradle.properties)
          CURRENT_HELPER_VERSION_CODE=$(sed -n 's/^SLEEPMANAGER_HELPER_VERSION_CODE=//p' gradle.properties)
          ROLLBACK_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          ROLLBACK_HELPER_VERSION_CODE=$((CURRENT_HELPER_VERSION_CODE + 1))
          ROLLBACK_DIR="$RUNNER_TEMP/sleepmanager-v0.6.0-rollback"

          git worktree add --detach "$ROLLBACK_DIR" v0.6.0

          sed -i             "s/^SLEEPMANAGER_VERSION_CODE=.*/SLEEPMANAGER_VERSION_CODE=$ROLLBACK_VERSION_CODE/"             "$ROLLBACK_DIR/gradle.properties"
          sed -i             "s/^SLEEPMANAGER_HELPER_VERSION_CODE=.*/SLEEPMANAGER_HELPER_VERSION_CODE=$ROLLBACK_HELPER_VERSION_CODE/"             "$ROLLBACK_DIR/gradle.properties"

          gradle -p "$ROLLBACK_DIR"             :app:assembleRelease             :helper:assembleRelease

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          MAIN_APK="$ROLLBACK_DIR/app/build/outputs/apk/release/app-release.apk"
          HELPER_APK="$ROLLBACK_DIR/helper/build/outputs/apk/release/helper-release.apk"

          MAIN_PACKAGE=$("$AAPT" dump badging "$MAIN_APK"             | sed -n "s/^package: name='\([^']*\)'.*/\1/p"             | head -n 1)
          HELPER_PACKAGE=$("$AAPT" dump badging "$HELPER_APK"             | sed -n "s/^package: name='\([^']*\)'.*/\1/p"             | head -n 1)

          [ "$MAIN_PACKAGE" = "com.med.sleepmanager" ]
          [ "$HELPER_PACKAGE" = "com.med.sleepmanager.helper" ]

          MAIN_CERT=$("$APKSIGNER" verify --print-certs "$MAIN_APK"             | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          HELPER_CERT=$("$APKSIGNER" verify --print-certs "$HELPER_APK"             | awk -F': ' '/certificate SHA-256 digest/{gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')
          EXPECTED_CERT=$(sed -n 's/^SLEEPMANAGER_SIGNING_SHA256=//p' gradle.properties             | tr '[:upper:]' '[:lower:]'             | tr -d ':')

          [ "$MAIN_CERT" = "$HELPER_CERT" ]
          [ "$MAIN_CERT" = "$EXPECTED_CERT" ]

          mkdir -p rollback-dist
          cp "$MAIN_APK" "rollback-dist/SleepManager-0.6.0-rollback.apk"
          cp "$HELPER_APK" "rollback-dist/SleepManager-Helper-1.1.0-rollback.apk"

          cat > rollback-dist/ROLLBACK_INFO.txt <<EOF
          SleepManager 0.6.0 rollback safety build
          Main versionName: 0.6.0
          Main versionCode: $ROLLBACK_VERSION_CODE
          Helper versionName: 1.1.0
          Helper versionCode: $ROLLBACK_HELPER_VERSION_CODE
          Signing SHA-256: $MAIN_CERT

          These APKs contain the v0.6.0 / Helper 1.1.0 source code with only
          higher version codes so they can replace the current dev beta without
          uninstalling it or clearing app data.
          EOF

          echo "main_version_code=$ROLLBACK_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "helper_version_code=$ROLLBACK_HELPER_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload 0.6.0 rollback safety APKs
        if: startsWith(github.ref, 'refs/heads/dev/')
        uses: actions/upload-artifact@v4
        with:
          name: SleepManager-0.6.0-rollback-safety
          path: rollback-dist/*
          if-no-files-found: error
          retention-days: 30
