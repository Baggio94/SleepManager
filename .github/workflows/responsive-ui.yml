name: Responsive UI checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev/0.5.0-beta1
      - dev/0.5.1
      - dev/0.5.3-beta1
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/responsive-ui.yml"

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run responsive UI matrix
        id: responsive_tests
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect
          script: gradle :app:connectedDebugAndroidTest

      - name: Print responsive UI test results
        if: always()
        run: |
          find app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; || true

      - name: Upload responsive UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when responsive tests fail
        if: steps.responsive_tests.outcome != 'success'
        run: exit 1
